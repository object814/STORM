Task: "JointTrainAgent"

BasicSettings:
  Seed: 0
  ImageSize: 64
  ReplayBufferOnGPU: True

Env:
  Suite: "metaworld"
  TaskName: "metaworld_drawer-open-v3"
  TimeLimit: 500
  CameraNames: ["topview", "front", "gripperPOV"]
  RewardMin: -1.0
  RewardMax: 0.0

JointTrainAgent:
  SampleMaxSteps: 200000
  BufferMaxLength: 100000
  BufferWarmUp: 1024
  NumEnvs: 1
  BatchSize: 16
  DemonstrationBatchSize: 0
  BatchLength: 64
  ImagineBatchSize: 1024
  ImagineDemonstrationBatchSize: 0
  ImagineContextLength: 8
  ImagineBatchLength: 16
  TrainDynamicsEverySteps: 1
  TrainAgentEverySteps: 1
  UseDemonstration: False
  SaveEverySteps: 5000

Models:
  WorldModel:
    # 3 cameras stacked along channel axis -> 9
    InChannels: 9
    TransformerMaxLength: 64
    TransformerHiddenDim: 512
    TransformerNumLayers: 2
    TransformerNumHeads: 8
    ContinuousAction: True
    # 7D: ee pos(3) + ee vel(3) + gripper(1) from ProprioMultiImageObsWrapper
    ProprioDim: 7
    ProprioHiddenDim: 256
    ProprioEmbedDim: 256

  Agent:
    NumLayers: 2
    HiddenDim: 512
    Gamma: 0.985
    Lambda: 0.95
    EntropyCoef: 3E-4
